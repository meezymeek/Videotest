# ~/.hermes/config.yaml — NOMAD-X starting point.
# Secrets (tokens, passwords) go in ~/.hermes/.env, referenced here as ${VAR}.
# Verify key names against the current Hermes docs: hermes config check

model:
  provider: custom
  base_url: http://127.0.0.1:8080/v1      # llama-server (--jinja -c 65536) or vLLM :8000
  default: gpt-oss-120b                    # Path B: gpt-oss-20b
  context_length: 65536
  streaming: true                          # set false if streaming tool calls break on your server

providers:
  local:
    base_url: http://127.0.0.1:8080/v1
    request_timeout_seconds: 600
    stale_timeout_seconds: 0
  wici:                                    # only after a WiCi One is in the bay
    base_url: http://wici-one.local/v1
    key_env: WICI_API_KEY

terminal:
  backend: local

delegation:
  max_parallel: 2

skills:
  external_dirs:
    - /opt/nomad/hermes/skills             # this repo's skills, checked out on the node
  write_approval: true

memory:
  write_approval: false

mcp_servers:
  homeassistant:
    url: http://127.0.0.1:8123/mcp_server/sse
    headers:
      Authorization: "Bearer ${HA_TOKEN}"
    timeout: 30
  nomad:
    command: /opt/nomad/venv/bin/python
    args: ["/opt/nomad/stack/nomad-mcp/server.py"]
    env:
      MQTT_HOST: "127.0.0.1"
      RIGCTLD: "127.0.0.1:4532"
      KIWIX_URL: "http://127.0.0.1:8081"
      HA_URL: "http://127.0.0.1:8123"
      HA_TOKEN: "${HA_TOKEN}"
    timeout: 120

matrix:
  require_mention: false
  auto_thread: true

gateway:
  systemd_watchdog_seconds: 120
  platforms:
    matrix:
      enabled: true                        # credentials in .env (MATRIX_HOMESERVER, MATRIX_ACCESS_TOKEN, MATRIX_ALLOWED_USERS)
    homeassistant:
      enabled: true                        # plugin: hermes plugins install homeassistant; HASS_TOKEN/HASS_URL in .env
      extra:
        url: http://127.0.0.1:8123
        watch_entities:
          - binary_sensor.nomad_lid_closed
          - sensor.nomad_battery_soc
          - sensor.nomad_wan_active
        cooldown_seconds: 30
    email:
      enabled: true                        # local MTA fed by Pat/Winlink; creds in .env
      require_authenticated_sender: false  # local MTA doesn't stamp Authentication-Results; allowlist mitigates
      extra:
        imap_host: 127.0.0.1
        imap_security: starttls
        imap_tls_verify: false
        smtp_host: 127.0.0.1
        smtp_security: starttls
        smtp_tls_verify: false
    sms:
      enabled: false                       # Hermes SMS is Twilio-only; SMS goes modem -> gammu -> Node-RED -> API server
    telegram:
      enabled: true                        # only works when WAN is up; harmless otherwise
    discord:
      enabled: false
    webhook:
      enabled: true
      extra:
        port: 8644
        rate_limit: 30
        routes:
          alert:                           # HA posts nomad/alerts here
            secret: "${WEBHOOK_SECRET}"
            prompt: "ALERT received from the node: {{ body }}. Assess, act per SOUL.md, and report."
            deliver: matrix
            skills: [comms-check, power-management, mesh-ops]
          comms-check:                     # cron/HA-triggered self-test
            secret: "${WEBHOOK_SECRET}"
            prompt: "Run /comms-check and post the table."
            deliver: matrix
  channel_overrides:
    meshtastic:                            # used by the bridge via the API server
      system_prompt_suffix: "Reply in <= 200 characters. No markdown."
